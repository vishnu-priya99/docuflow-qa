version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: docqa_postgres
    environment:
      POSTGRES_USER: docqa
      POSTGRES_PASSWORD: docqa
      POSTGRES_DB: docqa
    ports:
      - "5432:5432"
    volumes:
      - docqa_pg_data:/var/lib/postgresql/data
      - ./scripts/init_readonly_role.sql:/docker-entrypoint-initdb.d/10_readonly_role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docqa -d docqa"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: docqa_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - docqa_qdrant_data:/qdrant/storage

# No "api" service - the app runs directly via `uvicorn app.main:app`
# (see README), not containerized. This file only brings up the two
# backing services: `docker compose up -d postgres qdrant`.

volumes:
  docqa_pg_data:
  docqa_qdrant_data:
